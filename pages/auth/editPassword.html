<div class="container py-4" style="max-width: 950px;">
    <h3 class="text-primary text-center py-4">Changement de mot de passe</h3>
    <form class="my-3">
        <div class="my-3">
          <label for="PasswordInput" class="form-label">Mot de passe</label>
          <input type="password" class="form-control" id="PasswordInput" name="Password">
          <div class="invalid-feedback" id="passwordFeedback">
            Le mot de passe doit contenir au moins 8 caractères, dont une majuscule, une minuscule, un chiffre et un caractère spécial.
          </div>
        </div>
        <div class="my-3">
            <label for="ValidatePasswordInput" class="form-label">Confirmez votre mot de passe</label>
            <input type="password" class="form-control" id="ValidatePasswordInput" name="PasswordConfirm">
            <div class="invalid-feedback" id="validatePasswordFeedback">
                Les mots de passe ne correspondent pas.
            </div>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-primary" id="editPasswordButton" disabled>Valider</button>
        </div>
    </form>
</div>
