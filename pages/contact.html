<section>
    <div class="container py-4" style="max-width: 950px;">
        <h3 class="text-primary text-center py-4">Nous contacter</h3>
        <form>
            <div class="my-4">
            <label for="TitleInput" class="form-label">Sujet</label>
            <input type="text" class="form-control" id="TitleInput" placeholder="Sujet du message" name="Title">
            </div>
            <div class="my-4">
            <label for="EmailInput" class="form-label">Email <small>(pour recevoir une réponse)</small></label>
            <input type="email" class="form-control" id="EmailInput" placeholder="test@mail.fr" name="Email">
            </div>
            <div class="my-4">
            <label for="MessageInput" class="form-label">Message</label>
            <textarea class="form-control" id="MessageInput" placeholder="Votre message" name="Message" rows="4"></textarea>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary my-4">Envoyer</button>
            </div>
        </form>
    </div>
</section>
