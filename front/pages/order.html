<section>
    <div class="container py-4" style="max-width: 950px;">
        <h3 class="text-primary text-center py-4">Commander</h3>
        <form>
            <h4 class="mb-4">Vos Informations</h4>
            <div class="row">
                <div class="col-12 col-lg mb-4">
                    <label for="NomInput" class="form-label">Nom</label>
                <input disabled type="text" class="form-control" id="NomInput" placeholder="Votre nom" value="Doe" name="Nom">
                </div>
                <div class="col-12 col-lg mb-4">
                    <label for="PrenomInput" class="form-label">Prénom</label>
                    <input disabled type="text" class="form-control" id="PrenomInput" placeholder="Votre prénom" value="John" name="Prenom">
                </div>
            </div>
            <div class="row mb-4">
                <div class="col">
                    <label for="EmailInput" class="form-label">Email</label>
                    <input disabled type="email" class="form-control" id="EmailInput" placeholder="test@mail.com" name="Email">
                </div>
            </div>
            <div class="row mb-4">
                <div class="col-6">
                    <label for="TelInput" class="form-label">Téléphone</label>
                    <input disabled type="tel" class="form-control" id="TelInput" placeholder="Votre téléphone" value="0123456789" name="Telephone">
                </div>
            </div>
            <h4 class="pt-5 mb-4">La Prestation</h4>
            <div class="row align-items-end justify-content-center">
                <div class="col-12 col-lg mb-3">
                    <label for="DateInput" class="form-label">Date</label>
                    <input type="date" class="form-control" id="DateInput" name="Date"> 
                </div>
                <div class="d-flex flex-column col-3 col-lg-2 mb-3 align-items-center">
                    <div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="serviceChoisi" id="midiRadio">
                            <label class="form-check-label" for="midiRadio">
                                Midi
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="serviceChoisi" id="soirRadio" checked>
                            <label class="form-check-label" for="soirRadio">
                                Soir
                            </label>
                        </div>
                    </div>
                </div>
                <div class="col mb-3">
                    <label for="selectHour" class="form-label">Heure</label>
                    <select class="form-select" id="selectHour" name="Heure">
                        <option>19:30</option>
                        <option>19:45</option>
                        <option>20:00</option>
                        <option>20:15</option>
                        <option>20:30</option>
                        <option>20:45</option>
                        <option>21:00</option>
                    </select>
                </div>
            </div>
            <div class="col-12 my-3">
                    <label for="inputAddress" class="form-label">Addresse de livraison</label>
                    <input type="text" class="form-control" id="inputAddress" name="Adresse">
                </div>
            <div class="row">
                <div class="col-6 col-lg-3 mb-3">
                    <label for="inputZip" class="form-label">Code postal</label>
                    <input type="text" class="form-control" id="inputZip">
                </div>
                <div class="col-12 col-lg mb-3">
                    <label for="inputCity" class="form-label">Ville</label>
                    <input type="text" class="form-control" id="inputCity">
                </div>
            </div>
            <div class="col mb-3">
                <label for="selectMenu" class="form-label">Menu</label>
                <select class="form-select" id="selectMenu" name="Menu">
                    <option>Menu Tradition</option>
                    <option>Menu Pêcheur</option>
                    <option>Menu Grillades</option>
                    <option>Menu Prestige</option>
                </select>
            </div>
            <div class="my-3">
                <label for="NbConvivesInput" class="form-label">Nombres de convives</label>
                <input type="number" class="form-control" id="NbConvivesInput" placeholder="Combien vous êtes habituellement ?"  value="4" name="NbConvives"> 
            </div>
            <div class="my-3">
                <label for="AllergieInput" class="form-label">Allergies</label>
                <input type="text" class="form-control" id="AllergieInput" placeholder="Vos allergies (fruits de mer, arachides..)"  value="Cacahouetes" name="Allergies"> 
            </div>
            <div class="row pt-3">
                <div class="col">
                    <p style="font-weight: bold; font-size: 1rem;">TOTAL :</p>
                </div>
                <div class="col text-end">
                    <p style="font-weight: bold; font-size: 1rem;">- €</p>
                </div>
            </div>
            <div class="text-center py-4">
                <button type="submit" class="btn btn-primary">Valider la commande</button>
            </div>
        </form>        
    </div>
</section>
