<section>
    <div class="container py-4" style="max-width: 950px;">
        <article class="py-4">
            <h3 class="text-primary text-center">Les Menus</h3>
            <!-- Les cartes sont ajoutées ici par js/menus.js -->
            <div id="menusList"></div>
        </article>
    </div>
</section>

<!-- Modèle d'une carte, copié par js/menus.js pour chaque menu -->
<template id="menuTemplate">
    <div class="card text-bg-dark my-5" style="min-height: 170px;">
        <img src="/images/illustration_plat.jpg" alt="" class="card-img menu-image object-fit-cover position-absolute top-0 start-0 w-100 h-100" style="filter: brightness(0.8);">
        <div class="card-img-overlay position-relative">
            <div class="row m-1">
                <div class="col">
                    <h5 class="card-title menu-titre"></h5>
                    <p class="card-subtitle menu-personnes"></p>
                    <ul class="card-text small my-2 menu-plats"></ul>
                </div>
                <div class="col-auto text-end">
                    <h5 class="menu-prix"></h5>
                </div>
            </div>
            <div class="col text-end">
                <a href="#" class="btn btn-primary btn-sm stretched-link">+ de détails</a>
            </div>
        </div>
    </div>
</template>
